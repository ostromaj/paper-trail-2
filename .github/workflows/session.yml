name: Market-day session

# Runs continuously on market days (7:00 AM to just after the close, New York time),
# checking every 5 minutes. Started automatically by the "Trading bot" workflow, and it
# restarts itself before GitHub's 6-hour job limit. Outside that window it exits at once.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: paper-trail-session
  cancel-in-progress: false

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - name: Check every 5 minutes until the close
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cp bot/session.sh "$RUNNER_TEMP/session.sh" && bash "$RUNNER_TEMP/session.sh"

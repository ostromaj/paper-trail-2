name: Reset portfolio to $100

# Archives the current run (all trades and stats) into "Past runs",
# then starts a fresh $100 portfolio.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RESET to confirm"
        required: true
        default: ""

permissions:
  contents: write

concurrency:
  group: paper-trail-reset
  cancel-in-progress: false

jobs:
  reset:
    if: ${{ inputs.confirm == 'RESET' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Archive this run and start over
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash bot/cycle.sh --reset

name: Trading bot

# Runs one market check about every 5 minutes, all day, every day
# (stocks during market hours, crypto around the clock).
on:
  schedule:
    - cron: "1-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: paper-trail-bot
  cancel-in-progress: false

jobs:
  check-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - name: Start the market-day session if it isn't running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if python3 bot/window.py in-session; then
            active=$(gh run list --workflow session.yml --limit 10 --json status \
                     --jq 'map(select(.status != "completed")) | length' || echo 0)
            if [ "${active:-0}" = "0" ]; then
              gh workflow run session.yml --ref "$GITHUB_REF_NAME" && echo "Started the session."
            else
              echo "Session already running."
            fi
          fi

      - name: Check the markets and trade
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash bot/cycle.sh

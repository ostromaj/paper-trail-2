name: Trading bot

# Runs one market check about every 5 minutes, all day, every day
# (stocks during market hours, crypto around the clock).
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trail-bot
  cancel-in-progress: false

jobs:
  check-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Load the saved portfolio
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:dashboard.json > dashboard.json || true
          fi

      - name: Check the markets and trade
        run: python3 bot/run.py --state dashboard.json

      - name: Save the portfolio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash bot/save.sh

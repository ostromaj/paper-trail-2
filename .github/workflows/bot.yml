name: Trading bot

# Watchdog. The always-on "Market-day session" does the real work; this just makes sure
# it's running (GitHub's timer is unreliable and can skip hours, so it's only a backup).
on:
  schedule:
    - cron: "1-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: paper-trail-bot
  cancel-in-progress: false

jobs:
  check-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - name: Start the session if it isn't running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          active=$(gh run list --workflow session.yml --limit 10 --json status \
                   --jq 'map(select(.status != "completed")) | length' || echo 0)
          if [ "${active:-0}" = "0" ]; then
            gh workflow run session.yml --ref "$GITHUB_REF_NAME" && echo "Started the session."
          else
            echo "Session already running."
          fi

      - name: Check the markets and trade
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash bot/cycle.sh
